<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>锡汉唐 · Todo V2.0</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">WEB PROGRAMMING · WEEK 09</p>
      <h1>我的待办清单</h1>
      <p>锡汉唐 <span>2024150181</span></p>
    </header>
    <section class="panel" aria-labelledby="todo-heading">
      <div class="panel-head"><h2 id="todo-heading">任务</h2><span id="todo-count">0 项</span></div>
      <form id="todo-form" novalidate>
        <label for="todo-input">新增任务</label>
        <div class="form-row"><input id="todo-input" type="text" maxlength="100" placeholder="例如：完成第9周实验" autocomplete="off"><button type="submit">添加</button></div>
      </form>
      <div class="filter-bar" role="group" aria-label="筛选任务">
        <button type="button" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" data-filter="active" aria-pressed="false">未完成</button>
        <button type="button" data-filter="done" aria-pressed="false">已完成</button>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
      <p id="empty-state">还没有任务，先添加一项吧。</p>
      <ul id="todo-list" aria-label="待办任务"></ul>
    </section>
    <footer>数据保存在本机浏览器中。</footer>
  </main>
</body>
</html>
